<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
      font-size: 1rem;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
      width: 100%;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-card {
      position: relative;
      background-color: #1e293b;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .gallery-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .gallery-card .caption {
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #cbd5e1;
      background-color: #1e293b;
    }

    /* Modal / Lightbox Styles */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 0.5rem;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      border: none;
      background: none;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #64748b;
      border-top: 1px solid #1e293b;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Image Gallery</h1>
    <p>A curated collection of photos hosted on GitHub Pages</p>
  </header>

  <main>
    <div class="gallery-grid">
      <!-- Image 1 -->
      <div class="gallery-card" onclick="openModal('images/photo1.jpg')">
        <img src="images/photo1.jpg" alt="Photo 1" loading="lazy">
        <div class="caption">Photo Description 1</div>
      </div>

      <!-- Image 2 -->
      <div class="gallery-card" onclick="openModal('images/photo2.jpg')">
        <img src="images/photo2.jpg" alt="Photo 2" loading="lazy">
        <div class="caption">Photo Description 2</div>
      </div>

      <!-- Image 3 -->
      <div class="gallery-card" onclick="openModal('images/photo3.jpg')">
        <img src="images/photo3.jpg" alt="Photo 3" loading="lazy">
        <div class="caption">Photo Description 3</div>
      </div>
      
      <!-- Duplicate or add more gallery-card blocks as needed -->
    </div>
  </main>

  <footer>
    <p>Hosted with GitHub Pages</p>
  </footer>

  <!-- Lightbox Modal -->
  <div class="modal" id="imageModal" onclick="closeModal()">
    <button class="modal-close" aria-label="Close preview">&times;</button>
    <img id="modalImg" src="" alt="Expanded View">
  </div>

  <script>
    function openModal(src) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('active');
    }

    // Close modal on Escape key press
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>

</body>
</html>
